services:
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - DB_PATH=/app/data/db.sqlite
      - TTS_SERVICE_URL=http://tts-service:8001
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - tts-service

  tts-service:
    build: ./tts-service
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
